<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <fieldset>
        <h1>Dados Pessoais</h1>
        <form action="URL" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Digite seu email"><br><br>

            <label for="senha">Palavra-chave:</label>
            <input type="password" id="senha" name="senha" required placeholder="Digite sua senha"><br><br>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" required placeholder="Digite sua idade"><br><br>

            <label for="nascimento" placeholder="Digite sua data de nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required><br><br>

            <label for="cor">Cor favorita</label> 
            <input type="color" id="cor" name="cor"><br><br>

            <label for="ficheiro">Escolhe um ficheiro</label> 
            <input type="file" id="ficheiro" name="ficheiro"><br><br>

            <label for="manha">Manhã</label>
            <input type="radio" id="manha" name="turno" value="manha">

            <label for="manha">Tarde</label>
            <input type="radio" id="tarde" name="turno" value="tarde">

            <label for="manha">Noite</label>
            <input type="radio" id="noite" name="turno" value="noite"><br><br>

            <label for="html">HTML</label>
            <input type="checkbox" id="html" name="linguagens" value="html">

            <label for="css">CSS</label>
            <input type="checkbox" id="css" name="linguagens" value="css">

            <label for="js">JavaScript</label>
            <input type="checkbox" id="js" name="linguagens" value="js"><br><br>

            <input type="submit" value="Enviar">

        </form>
    </fieldset>

       <p>Estação Favorita:</p>    
       <input type="radio" id="primavera" name="estacao" value="Primavera" />    
       <label for="primavera">Primavera</label>    
       <input type="radio" id="verao" name="estacao" value="Verão" />    
       <label for="verao">Verão</label>    
       <input type="radio" id="outono" name="estacao" value="Outono" />    
       <label for="outono">Outono</label>    
       <input type="radio" id="inverno" name="estacao" value="Inverno" />    
       <label for="inverno">Inverno</label><br><br>    
       <p>Gostos:</p>    
       <input type="checkbox" id="musica" name="gostos" value="Música" />    
       <label for="musica">Música</label>    
       <input type="checkbox" id="cinema" name="gostos" value="Cinema" />    
       <label for="cinema">Cinema</label>    
       <input type="checkbox" id="desporto" name="gostos" value="Desporto" />    
       <label for="desporto">Desporto</label>    
       <input type="checkbox" id="viagens" name="gostos" value="Viagens" />    
       <label for="viagens">Viagens</label>    
       <br><br><br>    
       <input type="submit" value="Enviar">    
       <input type="reset" value="Limpar">  </fieldset> </form>
</body>
</html>
